name: Published cinematic UX acceptance
on:
  push:
    branches: [cinematic-render-production-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install chromium --with-deps
      - name: Verify Render cinematic release in Chromium
        run: python -u tests/live_cinematic_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-render-screenshots
          path: artifacts/cinematic-render/
          if-no-files-found: ignore
